<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碧潭 AR Hiro Marker</title>
  <style>
    body { margin: 0; padding: 32px 20px; color: #17302f; background: #f4f7f5; font-family: "Microsoft JhengHei", Arial, sans-serif; text-align: center; }
    main { max-width: 720px; margin: 0 auto; }
    p { line-height: 1.7; }
    img { display: block; width: min(82vw, 520px); margin: 26px auto; background: #fff; border: 20px solid #fff; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; color: #fff; background: #0d7c86; font-size: 16px; cursor: pointer; }
    @media print { button, p { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>碧潭 AR Hiro Marker</h1>
    <p>請用另一台手機開啟 AR 網頁，再將鏡頭對準下方標記。也可以先將此頁列印。</p>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="AR.js Hiro Marker 黑白辨識圖案">
    <button type="button" onclick="window.print()">列印 Marker</button>
  </main>
</body>
</html>
