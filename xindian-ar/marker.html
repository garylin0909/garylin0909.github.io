<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碧潭 AR Hiro Marker</title>
  <style>
    body { margin: 0; padding: 20px; color: #17302f; background: #fff; font-family: "Microsoft JhengHei", Arial, sans-serif; text-align: center; }
    main { max-width: 900px; margin: 0 auto; }
    p { line-height: 1.7; }
    img { display: block; width: min(88vmin, 720px); margin: 12px auto; background: #fff; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; color: #fff; background: #0d7c86; font-size: 16px; cursor: pointer; }
    @media print { button, p { display: none; } }
    @media (max-width: 600px) {
      body { padding: 8px; }
      h1 { margin: 4px 0; font-size: 20px; }
      p { margin: 4px 0; font-size: 13px; }
      img { width: min(94vw, 720px); margin: 6px auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>碧潭 AR Hiro Marker</h1>
    <p>請將標記完整放入鏡頭，避免反光與裁切；列印辨識通常最穩定。</p>
    <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="AR.js Hiro Marker 黑白辨識圖案">
    <button type="button" onclick="window.print()">列印 Marker</button>
  </main>
</body>
</html>
