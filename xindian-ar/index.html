<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d7c86">
  <title>碧潭吊橋 AR 導覽｜新店大眾運輸旅遊</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #071b1c;
    }
    a-scene,
    a-scene canvas.a-canvas,
    #arjs-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      margin: 0 !important;
    }
    a-scene {
      overflow: hidden !important;
    }
    a-scene canvas.a-canvas,
    #arjs-video {
      object-fit: cover !important;
    }
    .guide {
      position: fixed;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      width: min(92%, 480px);
      padding: 12px 16px;
      color: #fff;
      background: rgba(7, 27, 28, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }
    .guide strong { display: block; margin-bottom: 4px; font-size: 17px; }
    .guide span { display: block; color: #d2efeb; font-size: 14px; line-height: 1.5; }
    .guide a { display: inline-block; margin-top: 8px; color: #fff; font-size: 14px; font-weight: 700; }
    .status {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      min-width: 210px;
      padding: 9px 14px;
      color: #17302f;
      background: #f2a23a;
      border-radius: 999px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      transform: translateX(-50%);
    }
    .status.found { color: #fff; background: #16845c; }
  </style>
</head>
<body>
  <div class="guide">
    <strong>碧潭吊橋 AR 導覽</strong>
    <span>允許相機權限後，將鏡頭對準另一個螢幕或紙張上的 Hiro Marker。</span>
    <a href="marker.html" target="_blank" rel="noopener">開啟 Hiro Marker</a>
  </div>
  <div class="status" id="status" role="status">正在尋找 Hiro Marker</div>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    <a-marker id="hiro-marker" preset="hiro">
      <a-cylinder position="0 0.08 0" radius="0.76" height="0.08" color="#0d7c86"></a-cylinder>
      <a-torus
        position="0 0.52 0"
        rotation="90 0 0"
        radius="0.56"
        radius-tubular="0.055"
        color="#75b843"
        animation="property: rotation; to: 90 360 0; loop: true; dur: 5000">
      </a-torus>
      <a-box
        position="0 0.5 0"
        width="0.74"
        height="0.22"
        depth="0.16"
        color="#f2a23a"
        animation="property: position; dir: alternate; to: 0 0.68 0; loop: true; dur: 1200">
      </a-box>
      <a-text
        value="BITAN BRIDGE"
        position="-0.88 1.05 0"
        scale="0.72 0.72 0.72"
        color="#ffffff"
        align="left">
      </a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const marker = document.querySelector("#hiro-marker");
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");

    scene.addEventListener("camera-init", () => {
      status.textContent = "相機已啟動，請對準 Hiro Marker";
    });

    scene.addEventListener("camera-error", () => {
      status.textContent = "無法開啟相機，請檢查瀏覽器權限後重新整理";
    });

    marker.addEventListener("markerFound", () => {
      status.textContent = "已辨識碧潭 AR 標記";
      status.classList.add("found");
    });
    marker.addEventListener("markerLost", () => {
      status.textContent = "正在尋找 Hiro Marker";
      status.classList.remove("found");
    });
  </script>
</body>
</html>
